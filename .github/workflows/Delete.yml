name: Delete 022108 Releases

on:
  workflow_dispatch:  # 允许手动触发工作流

jobs:
  delete_022108_releases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: List releases (for debugging)
        run: |
          # 获取所有 releases 的标签并调试输出
          releases=$(gh release list --json tagName -q '.[].tagName')
          echo "Raw releases output: $releases"  # 打印所有获取到的标签
        env:
          GH_TOKEN: ${{ secrets.PAT }}  # 使用 GitHub 令牌进行身份验证

      - name: Delete 022108 releases
        run: |
          # 获取 releases 标签并筛选出 022108 开头的标签
          releases=$(gh release list --json tagName -q '.[].tagName')
          echo "Releases: $releases"  # 输出 releases 列表以便检查

          # 检查是否有标签匹配 022108 开头
          if echo "$releases" | grep -E "^022108"; then
            echo "Deleting releases starting with 022108"
            echo "$releases" | grep -E "^022108" | while read release; do
              echo "Deleting release $release"
              gh release delete "$release" --yes
            done
          else
            echo "No releases found matching 022108"
            exit 0
          fi
        env:
          GH_TOKEN: ${{ secrets.PAT }}  # 使用 GitHub 令牌进行身份验证
