name: Delete DYYY Releases

on:
  workflow_dispatch:  # 允许手动触发工作流

jobs:
  delete_dyyy_releases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: List releases (for debugging)
        run: |
          # 获取所有 releases 的标签，调试输出
          releases=$(gh release list --json tagName -q '.[].tagName')
          echo "Releases raw output: $releases"  # 打印原始输出查看格式
        env:
          GH_TOKEN: ${{ secrets.PAT }}  # 使用 GitHub 令牌进行身份验证

      - name: Delete DYYY releases
        run: |
          # 获取 releases 标签并筛选出 DYYY 开头的标签
          releases=$(gh release list --json tagName -q '.[].tagName')
          echo "Releases: $releases"  # 输出 releases 列表以便检查

          # 如果没有找到 DYYY 开头的标签，退出
          if echo "$releases" | grep -q "^DYYY"; then
            echo "Deleting releases starting with DYYY"
            echo "$releases" | grep "^DYYY" | while read release; do
              echo "Deleting release $release"
              gh release delete $release --yes
            done
          else
            echo "No releases found matching DYYY"
            exit 0
          fi
        env:
          GH_TOKEN: ${{ secrets.PAT }}  # 使用 GitHub 令牌进行身份验证
